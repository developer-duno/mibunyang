<!DOCTYPE html>

    .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; }
    .status.success { background: #EDFCF2; color: #16A34A; border: 1px solid #A7F3D0; }
    .status.error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
    .status.info { background: #EEF3FF; color: #2563EB; border: 1px solid #C3D6FD; }
    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #E8EAF0; color: #6B7280; font-size: 13px; }
