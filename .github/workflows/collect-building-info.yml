name: Building Info Collection (MOLIT)

on:
  schedule:
    - cron: '0 16 10 * *' # 매월 10일 UTC 16:00 = KST 01:00
    - cron: '0 16 11 * *' # 매월 11일 — 10일 토요일 fallback
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force recollect (이미 있는 것도 재수집)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-building:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check Saturday conflict (10일 토요일 → 11일 fallback)
        id: check-day
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(date -u +%d)
          DOW=$(date -u +%u)  # 1=Mon ... 6=Sat 7=Sun

          if [ "$TODAY" = "10" ] && [ "$DOW" = "6" ]; then
            echo "::notice::10일 토요일 — naver-estate-web public_data(~3,600) 충돌 방지, 11일 자동 재실행"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$TODAY" = "11" ]; then
            YESTERDAY_DOW=$(date -u -d "yesterday" +%u 2>/dev/null || date -u -v-1d +%u)
            if [ "$YESTERDAY_DOW" = "6" ]; then
              echo "::notice::10일 토요일 fallback — 11일 실행"
              echo "skip=false" >> $GITHUB_OUTPUT
            else
              echo "::notice::10일이 토요일 아니었음 — 11일 스킵"
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        if: steps.check-day.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.check-day.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-day.outputs.skip != 'true'
        run: npm ci

      - name: Validate secrets
        if: steps.check-day.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$MOLIT_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, MOLIT_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect building info
        if: steps.check-day.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/collectors/molit-building-info.mjs $ARGS

      - name: Sync naver complex data
        if: steps.check-day.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          node scripts/collectors/sync-naver-complex.mjs $ARGS
