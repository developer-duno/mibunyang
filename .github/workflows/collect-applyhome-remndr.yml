name: Collect Applyhome Remndr (잔여세대 평형 + 취소후재공급)

on:
  schedule:
    # 청약홈 주간 체인 뒤에 붙인다 (설계 §6-3):
    #   11:30 collect-applyhome(seed→경쟁률) → 12:30 collect-applyhome-detail → 13:30 여기
    # notify-subscribers 는 14:00 KST('0 5 * * 1') 라 겹치지 않는다 (2026-08-07 재확인).
    # concurrency group 이 같아 겹쳐도 대기만 하지만, 순서를 명시적으로 지킨다.
    - cron: '30 4 * * 1'  # 매주 월요일 13:30 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'false'

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 호출 11회(4,626+436행 / perPage 1000) + upsert 2회 = 실측 기준 수 분. 여유 포함 15분.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$MOLIT_KEY" ]; then
            echo "::error::Required secrets are not set"
            exit 1
          fi

      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          node scripts/collectors/collect-applyhome-remndr.mjs $FLAGS
