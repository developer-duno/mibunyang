name: Transport Accessibility Collection

on:
  # 세션 491: 월간 schedule 삭제 (중복 실행). collect-naver-listings-incremental.yml 이 매일
  # `node scripts/collectors/transport-tago.mjs` 를 무인자로 실행한다 — 이 파일의 schedule 발화도
  # inputs 가 없어 $ARGS 가 빈 값이므로 완전히 동일한 명령이었다. workflow_dispatch 는 --force
  # 전체 재수집 창구라 반드시 남긴다. (구: cron '0 19 4 * *' 매월 4일 KST 04:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false
      force:
        description: '전체 재수집 (증분 스킵 무시)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$KAKAO_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, KAKAO_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect transport data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
        run: |
          # 세션 496: 이 job 은 timeout-minutes: 60 이라 스크립트 기본 예산(180분, 240분
          # job 용)이 여기선 영원히 발동 못 한다 — job timeout 도달은 grace 0 즉시 SIGKILL
          # 이라 [budget] 로그도 recordCollectorRun 도 못 남기고 죽는다(graceful-shutdown-
          # coverage.md 실증 답습). 이 워크플로 전용으로 60분에 맞는 예산을 명시한다.
          ARGS="--budget-min=50"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/collectors/transport-tago.mjs $ARGS
