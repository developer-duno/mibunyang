name: Naver Collection (via Tunnel)

on:
  schedule:
    - cron: '0 20 * * 1,4' # 월/목 UTC 20:00 = KST 05:00
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit apartments (0=all)'
        required: false
        type: number
        default: 0
      dry_run:
        description: 'Dry run'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-naver:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install curl_cffi httpx

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY required"
            exit 1
          fi
          if [ -z "$NAVER_PROXY" ]; then
            echo "::warning::NAVER_PROXY not set — tunnel proxy disabled"
          fi

      - name: Test tunnel connectivity
        if: ${{ secrets.NAVER_PROXY != '' }}
        env:
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
        run: |
          python3 -c "
          from curl_cffi import requests as r
          s=r.Session(impersonate='chrome',proxies={'https':'$NAVER_PROXY','http':'$NAVER_PROXY'})
          resp=s.get('https://new.land.naver.com',timeout=15)
          print(f'Tunnel OK: HTTP {resp.status_code}')
          "

      - name: Collect Naver listings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
        run: |
          ARGS=""
          if [ -n "$NAVER_PROXY" ]; then
            ARGS="--proxy=$NAVER_PROXY"
          fi
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/collectors/naver-collect.py $ARGS

  post-process:
    needs: collect-naver
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Sync naver data to apartments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/sync-naver-complex.mjs

      - name: Calculate exclusive ratio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/calc-exclusive-ratio.mjs
