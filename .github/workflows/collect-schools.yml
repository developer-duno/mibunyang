name: School District Collection

on:
  # 세션118: 매월 1일 UTC 20:00에 unsold-kosis/schools/childcare 3종이
  # 같은 concurrency 그룹·같은 시간에 시작해 30분 timeout으로 cancelled
  # 연속. schools를 2일 UTC 22:00(KST 07:00)로 이동 + 그룹 분리로 해소.
  #
  # 세션 491: 그 월간 schedule 자체를 삭제 (중복 실행). collect-naver-listings-incremental.yml 이
  # 매일 `node scripts/collectors/schools-neis.mjs` 를 무인자로 실행 — 동일 명령이었다.
  # workflow_dispatch 는 limit/force 수동 보충 창구라 남긴다. (구: cron '0 22 2 * *' 매월 2일 KST 07:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false
      limit:
        description: '처리 건수 제한 — 대상 중 updated_at 오래된 순으로 이 건수만(세션568, 빈 값 = 전체)'
        required: false
        type: string
        default: ''
      ids:
        description: '지정 단지만 다시 계산 (apartments.id 를 쉼표로 구분, 30일 건너뛰기 무시 · 빈 값 = 평소대로)'
        required: false
        type: string
        default: ''

concurrency:
  group: school-collection
  cancel-in-progress: false

jobs:
  collect-schools:
    runs-on: ubuntu-latest
    # 세션118: 2026-04-19 수동 dispatch가 60분 timeout으로 cancelled
    # (2001건 × NEIS/SCHOOLINFO API 호출 부하). 120분으로 확장.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$KAKAO_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, KAKAO_KEY secret 필요"
            exit 1
          fi
          if [ -z "${{ secrets.NEIS_KEY }}" ]; then
            echo "::warning::NEIS_KEY 미설정 — NEIS 학교 상세 보강 스킵됨"
          fi
          if [ -z "${{ secrets.SCHOOLINFO_KEY }}" ]; then
            echo "::warning::SCHOOLINFO_KEY 미설정 — 학교알리미 학생수 보강 스킵됨"
          fi
          echo "Secrets validated"

      - name: Collect school data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          # 입력을 스크립트에 직접 끼우지 않고 환경변수로 받아 형식을 검사한다(명령 주입 방지, 세션567).
          IDS: ${{ inputs.ids }}
          # limit 도 같은 방식 — 셸에 직접 끼우면 `1; <명령>` 같은 값이 그대로 실행된다(세션569).
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "$LIMIT" ]; then
            if ! printf '%s' "$LIMIT" | grep -Eq '^[0-9]{1,5}$'; then
              echo "::error::limit 형식 오류 — 숫자(1~5자리)만"
              exit 1
            fi
            ARGS="$ARGS --limit $LIMIT"
          fi
          if [ -n "$IDS" ]; then
            if ! printf '%s' "$IDS" | grep -Eq '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$'; then
              echo "::error::ids 형식 오류 — 영문·숫자·-·_ 로 된 id 를 쉼표로만 구분"
              exit 1
            fi
            ARGS="$ARGS --ids=$IDS"
          fi
          node scripts/collectors/schools-neis.mjs $ARGS
