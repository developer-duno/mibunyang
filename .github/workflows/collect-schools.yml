name: School District Collection

on:
  # 세션118: 매월 1일 UTC 20:00에 unsold-kosis/schools/childcare 3종이
  # 같은 concurrency 그룹·같은 시간에 시작해 30분 timeout으로 cancelled
  # 연속. schools를 2일 UTC 22:00(KST 07:00)로 이동 + 그룹 분리로 해소.
  schedule:
    - cron: '0 22 2 * *' # 매월 2일 UTC 22:00 = KST 07:00 (이전: 1일 05:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false
      limit:
        description: '처리 건수 제한 (사전 검증용, 빈 값 = 전체)'
        required: false
        type: string
        default: ''

concurrency:
  group: school-collection
  cancel-in-progress: false

jobs:
  collect-schools:
    runs-on: ubuntu-latest
    # 세션118: 2026-04-19 수동 dispatch가 60분 timeout으로 cancelled
    # (2001건 × NEIS/SCHOOLINFO API 호출 부하). 120분으로 확장.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$KAKAO_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, KAKAO_KEY secret 필요"
            exit 1
          fi
          if [ -z "${{ secrets.NEIS_KEY }}" ]; then
            echo "::warning::NEIS_KEY 미설정 — NEIS 학교 상세 보강 스킵됨"
          fi
          if [ -z "${{ secrets.SCHOOLINFO_KEY }}" ]; then
            echo "::warning::SCHOOLINFO_KEY 미설정 — 학교알리미 학생수 보강 스킵됨"
          fi
          echo "Secrets validated"

      - name: Collect school data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          node scripts/collectors/schools-neis.mjs $ARGS
