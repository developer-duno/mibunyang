name: Naver Units Correction
# ⚠️ 네이버 API는 한국 IP 필요 — GitHub Actions(해외 IP)에서 JWT 차단됨
# 로컬 실행: bash scripts/run-naver-local.sh
# 또는: node scripts/collectors/naver-units.mjs
on:
  workflow_dispatch: # 수동 전용 (스케줄 비활성화)

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  correct-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Required secrets missing"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run Naver units correction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/naver-units.mjs
