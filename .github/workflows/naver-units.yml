name: Naver Units Correction
on:
  schedule:
    - cron: '0 17 * * *' # UTC 17:00 = KST 02:00 (daily-deploy 1시간 전)
  workflow_dispatch: # 수동 실행

permissions:
  contents: write

jobs:
  correct-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Run Naver units correction
        run: python scripts/naver-units.py
        continue-on-error: true

      - name: Commit & Push
        run: |
          if [ ! -f public/data/naver-units.json ]; then
            echo "naver-units.json not generated, skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/naver-units.json
          git diff --staged --quiet || git commit -m "data: 네이버 세대수 보정 업데이트"
          git push
