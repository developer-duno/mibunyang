name: Trade Stats Calculation

on:
  schedule:
    # 세션 491: 주간 → 격주(7·21일). 주 입력 trades 는 로컬 러너 kosis-local-runner(매월 6일)에만 갱신되므로
    # (세션 515: MOLIT 해외 IP 차단으로 collect-trades.yml 삭제 → 집서버 이전, 발화일 6일은 그대로)
    # 그 사이 값이 바뀔 원천이 없다(23일 간격 두 실행의 처리 건수 차 2155→2159 = 4건). 보조 입력
    # articles 폴백 때문에 월 1회가 아닌 격주로 남긴다. 7일 = collect-trades 다음날.
    - cron: '0 16 7,21 * *' # 매월 7·21일 UTC 16:00 = KST 익일 01:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-trade-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 세션 309: 15 → 30. DSR batch fix 후 자연 증가 2배까지 안전망 (이전 14분 56초 boundary 사고 답습).

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Calculate trade stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/trade-stats.mjs $ARGS
