name: Collect Building Hub (에너지+인허가)

on:
  schedule:
    # 매월 15일 06:00 UTC (한국시간 15:00)
    - cron: '0 6 15 * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run building hub collector
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/collect-building-hub.mjs
