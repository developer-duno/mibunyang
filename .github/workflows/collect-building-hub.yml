name: Collect Building Hub (에너지+인허가)

on:
  schedule:
    # 세션 491: 월간 → 분기(1·4·7·10월 15일). 04-15·05-18·06-15 세 번의 월간 실행이 모두
    # `성공 0 | 실패 0 | 스킵 2000`(API 호출은 매번 2,794회)으로 새로 채운 행이 0건이었다.
    # 현재 화면의 elec_usage_kwh 603건·gas_usage_mj 470건은 전부 2026-03-26 일괄 적재분이라
    # 분기로 내려도 낡거나 비지 않는다. 10/15 실행에서 `성공 N`>0 이면 월간으로 되돌릴 것.
    - cron: '0 6 15 1,4,7,10 *' # 분기 15일 06:00 UTC (한국시간 15:00)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run building hub collector
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/collect-building-hub.mjs
