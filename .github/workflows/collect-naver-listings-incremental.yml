name: Naver Post-Processing (Incremental)

on:
  schedule:
    - cron: '30 20 * * *' # UTC 20:30 = KST 05:30 (core UTC 19:00 + 실측 56:03 종료 19:56 후 마진 34분)
  workflow_dispatch:

concurrency:
  group: naver-postprocess-incremental
  cancel-in-progress: false

jobs:
  post-process-incremental:
    runs-on: ubuntu-latest
    # 세션229 D-2 신규 박제 (실측 transport 35:09 + infra 10:15 + schools 18:13 = 63:37 + 마진 26:23) → 90m 정정
    # 세션294 정정 (run 26311529575 실측 transport 74:48 + infra 15:16 도중 cancelled, 90:15 boundary 초과) → 120m
    # 세션327 정정: 5/26 run 26475044298 = 120m 1초 boundary cancelled.
    #   실측 자연 100% 완료 = transport 68m46s + infra 22m32s + schools 추정 40m41s = 132m.
    #   직전 5/25 success 109m. 자연 변동 ±10% (σ 0.385s/단지, Z-score 0.53 정상 범위).
    #   외부 API 응답 분산 × 3단계 누적 = 마진 50% 의무 → 180m.
    # 세션327 실증 (run 26502989962, timeout=2 dry-run): job timeout-minutes 도달 = step 즉시 SIGKILL (grace 0).
    #   graceful break 박힘은 `gh run cancel` 수동 명령 시에만 partial 기록. 자연 timeout = SIGKILL = collector_runs row 0.
    # 세션338 정정 (run 26538887941 cancelled): 5/22+5/26+5/27 3주 연속 cancelled.
    #   진앙 = NEIS 교육정보 API 만성 지연 (5/27 = 12배 지연, schools 단지당 약 5.1초).
    #   schools-neis resume self skip 박힘 (NEIS 보강 완결성 + 30일 이내 skip).
    #   첫 cron (5/29) 박힘 처리량: skip 1235건 + 처리 766건 = 51분 (12배 지연 지속 시).
    #   6/27 (30일 후) 전수 갱신: 2001건 × 4초 = 134분 + transport 64 + infra 21 = 219분.
    #   240m = 마진 21분 (40%) 박힘.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$KAKAO_KEY" ]; then
            echo "::error::Required secrets missing"
            exit 1
          fi

      - name: Collect transport (incremental)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: node scripts/collectors/transport-tago.mjs

      - name: Collect infra (incremental)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: node scripts/collectors/infra-kakao.mjs

      - name: Collect schools (incremental)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
        # 세션568: --limit 1200 — 2026-09-23 KST 하루에 schools 3,068행 중 2,654행이 같은
        # 시간대(주로 05~07시)에 몰려 updated_at 30일이 지나 동시 만료한다(10/23~24 재발
        # 예정, trg_schools_updated 를 UPDATE OF nearby_schools 로 좁히기 전까지는 rescaleOnly·
        # 어린이집 수집기도 시계를 앞당겼기 때문). --limit 은 이제 오래된 순으로 자르므로
        # (selectProcessList) 상한을 걸어도 뒤쪽 단지가 굶지 않는다. 평소 신규/재수집 대상은
        # 하루 약 100곳 수준이라 1,200 은 영향이 없고, 몰린 날에도 1,200곳 ≈ 1.5~2시간으로
        # 240분 timeout 안에 들어온다(나머지는 다음날로 자연 이월).
        run: node scripts/collectors/schools-neis.mjs --limit 1200
