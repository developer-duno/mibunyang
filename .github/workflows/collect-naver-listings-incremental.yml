name: Naver Post-Processing (Incremental)

on:
  schedule:
    - cron: '30 20 * * *' # UTC 20:30 = KST 05:30 (core UTC 19:00 + 실측 56:03 종료 19:56 후 마진 34분)
  workflow_dispatch:

concurrency:
  group: naver-postprocess-incremental
  cancel-in-progress: false

jobs:
  post-process-incremental:
    runs-on: ubuntu-latest
    # 세션229 D-2 신규 박제 (실측 transport 35:09 + infra 10:15 + schools 18:13 = 63:37 + 마진 26:23) → 90m 정정
    # 세션294 정정 (run 26311529575 실측 transport 74:48 + infra 15:16 도중 cancelled, 90:15 boundary 초과) → 120m
    # 세션327 정정: 5/26 run 26475044298 = 120m 1초 boundary cancelled.
    #   실측 자연 100% 완료 = transport 68m46s + infra 22m32s + schools 추정 40m41s = 132m.
    #   직전 5/25 success 109m. 자연 변동 ±10% (σ 0.385s/단지, Z-score 0.53 정상 범위).
    #   외부 API 응답 분산 × 3단계 누적 = 마진 50% 의무 → 180m.
    # ⚠️ 임시 2분 (graceful break SIGTERM 실증 자리, 본 PR 머지 전 복원 의무)
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$KAKAO_KEY" ] || [ -z "$TAGO_KEY" ]; then
            echo "::error::Required secrets missing"
            exit 1
          fi

      - name: Collect transport (incremental)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
        run: node scripts/collectors/transport-tago.mjs

      - name: Collect infra (incremental)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: node scripts/collectors/infra-kakao.mjs

      - name: Collect schools (incremental)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: node scripts/collectors/schools-neis.mjs
