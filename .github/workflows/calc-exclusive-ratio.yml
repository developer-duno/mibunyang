name: Exclusive Ratio Calculation

on:
  # 세션 491: 주간 schedule 삭제 (중복 실행). 같은 스크립트 calc-exclusive-ratio.mjs 를
  # collect-naver-listings.yml(Naver Core, 매일 UTC 19:00) 마지막 스텝이 이미 매일 실행한다 →
  # 주간보다 오히려 잦아 갱신 빈도 손실 0. 수동 재실행 창구로 workflow_dispatch 만 남긴다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: calc-collection # data-collection 큐(fill-missing-data Phase 5 6h 점유)와 분리 — 외부 API 미사용·멱등 계산
  cancel-in-progress: false

jobs:
  calc-exclusive-ratio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Calculate exclusive ratios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/calc-exclusive-ratio.mjs $ARGS
