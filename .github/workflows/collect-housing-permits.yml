name: Housing Permits Data Collection

on:
  schedule:
    # 세션 491: 월간 → 분기(1·4·7·10월 10일). MOLIT 주택건설실적 API 장기 중단으로 최근 3회 연속
    # success + ok_count=0 (신규 유입 0건). 지금도 안 채워지므로 분기로 내려도 추가 낡음이 없고,
    # API 회복 시 monitor ⑤(stale_days=38)가 잡는다. 회복 확인되면 월간으로 되돌릴 것.
    - cron: '0 21 10 1,4,7,10 *' # 분기 10일 UTC 21:00 = KST 06:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-housing-permits:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$MOLIT_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, MOLIT_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect housing permits data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/housing-permits.mjs $ARGS
