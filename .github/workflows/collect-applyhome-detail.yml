name: Collect Applyhome Detail (Schedule + Units)

on:
  schedule:
    # 세션 467 주간화: 월간(13일)일 땐 신규 공고 일정이 접수 시작 전에 못 들어와 미래 접수일이
    # 항상 0건 (분양 알림 발송기의 이벤트 소스가 죽음). collect-applyhome seed(월 11:30) 뒤 1시간.
    # 호출량 = run 당 10~20회 (perPage 1000 전량 페이지네이션 × 2 엔드포인트)라 쿼터 영향 무시 가능.
    - cron: '30 3 * * 1'  # 매주 월요일 12:30 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'false'

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$MOLIT_KEY" ]; then
            echo "::error::Required secrets are not set"
            exit 1
          fi

      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          node scripts/collectors/collect-applyhome-detail.mjs $FLAGS
