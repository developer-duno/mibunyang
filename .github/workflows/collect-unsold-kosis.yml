name: KOSIS Unsold Collection

on:
  schedule:
    - cron: '0 20 8 * *' # 매월 8일 UTC 20:00 = KST 05:00 (세션 260: 1일 cron 동시 충돌 분산 — childcare 와 동일 시각 충돌 분리)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-unsold:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$KOSIS_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, KOSIS_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect KOSIS unsold data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/collect-unsold-kosis.mjs $ARGS
