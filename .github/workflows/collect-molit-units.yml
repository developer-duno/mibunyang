name: Collect MOLIT Units
on:
  schedule:
    - cron: '0 18 6 * *' # 매월 6일 KST 03:00 (실거래 데이터 매월 5일 갱신)
  workflow_dispatch: # 수동 실행

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 세션 500: 이전엔 미지정이라 GitHub 기본 360분이 적용됐다. 6시간 창은 (a) 멈춤 사고 시
    # Actions 분을 통째로 태우고(약 $2.16) (b) `data-collection` 그룹에서 이 잡의 실행창 안에
    # purge-consults(+60분)·collect-trades(+120분)·nearby-childcare(+150분) 3개가 들어와
    # 대기 자리(1개)를 밀어내는 조용한 취소의 가해자가 된다.
    #   실측 소요: 03-15 17분33초(최대) · 04-06 9분28초 · 06-06 5분24초 · 07-06 3분45초 · 05-24 1분30초대
    #   → 45분 = 최대 실측의 2.5배 마진. 창 45분이면 첫 도착(+60분)이 창 밖이라 도착 0개.
    # 잘려도 안전한 구조다 — molit-units.mjs 는 단지마다 즉시 UPDATE(L108) 하고, 다음 회차 대상이
    # `units<=1 또는 unsold_rate>=100` 자기선택이라 남은 단지가 자동으로 다시 잡힌다.
    # (⚠️ timeout-minutes 도달은 SIGKILL·grace 0 이라 graceful break 는 수동 cancel 때만 유효 — 세션327)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$MOLIT_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Required secrets missing"
            exit 1
          fi
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run MOLIT units correction
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/molit-units.mjs
