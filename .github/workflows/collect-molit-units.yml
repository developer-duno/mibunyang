name: Collect MOLIT Units
on:
  schedule:
    - cron: '0 18 6 * *' # 매월 6일 KST 03:00 (실거래 데이터 매월 5일 갱신)
  workflow_dispatch: # 수동 실행

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$MOLIT_KEY" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Required secrets missing"
            exit 1
          fi
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run MOLIT units correction
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/molit-units.mjs
