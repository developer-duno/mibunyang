name: Apply DB Migration
on:
  workflow_dispatch:

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const fs = require('fs');

          async function main() {
            const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY, {
              auth: { autoRefreshToken: false, persistSession: false },
              db: { schema: 'public' }
            });

            // 1. noxious_dist 컬럼 존재 여부 확인
            const { error: noxErr } = await sb.from('apartments').select('noxious_dist').limit(1);
            if (noxErr && noxErr.message.includes('does not exist')) {
              console.log('Adding noxious_dist column...');
              const { error } = await sb.rpc('exec_sql', {
                sql: 'ALTER TABLE apartments ADD COLUMN IF NOT EXISTS noxious_dist REAL'
              });
              if (error) console.log('noxious_dist via rpc failed:', error.message, '— apply manually via Dashboard');
              else console.log('noxious_dist column added');
            } else {
              console.log('noxious_dist column already exists');
            }

            // 2. net_migration 컬럼 존재 여부 확인
            const { error: migErr } = await sb.from('regions').select('net_migration').limit(1);
            if (migErr && migErr.message.includes('does not exist')) {
              console.log('Adding net_migration column...');
              const { error } = await sb.rpc('exec_sql', {
                sql: 'ALTER TABLE regions ADD COLUMN IF NOT EXISTS net_migration INTEGER'
              });
              if (error) console.log('net_migration via rpc failed:', error.message, '— apply manually via Dashboard');
              else console.log('net_migration column added');
            } else {
              console.log('net_migration column already exists');
            }

            // 3. apartments_flat VIEW 상태 확인
            const { data, error: viewErr, count } = await sb.from('apartments_flat').select('id', { count: 'exact', head: true });
            console.log('apartments_flat VIEW:', viewErr ? 'ERROR: ' + viewErr.message : 'count=' + count);

            console.log('\nDone. If rpc failed, apply the migration SQL manually via Supabase Dashboard SQL Editor:');
            console.log('File: supabase/migrations/20260314000000_add_missing_columns.sql');
          }
          main().catch(e => { console.error(e); process.exit(1); });
          "
