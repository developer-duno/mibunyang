name: Layout Estimation

on:
  schedule:
    - cron: '0 23 * * 0' # 매주 일요일 UTC 23:00 = KST 월요일 08:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: calc-collection # data-collection 큐(fill-missing-data Phase 5 6h 점유)와 분리 — 외부 API 미사용·멱등 계산
  cancel-in-progress: false

jobs:
  calc-layout:
    runs-on: ubuntu-latest
    # ⚠️ 세션 491 적대검증 후속: 10 → 30.
    #    같은 세션에서 PostgREST max_rows=1000 상한을 풀면서 complexes 가 1,000 → 63,838건이 됐고,
    #    이름 유사도 비교가 **8,720만 쌍**(실측)으로 늘었다. 로컬 순수 CPU 벤치 140초이고
    #    GitHub 러너는 더 느리므로 3~5분, 여기에 npm ci·조회·순차 UPDATE 가 더해진다.
    #    10분이면 grace 0 SIGKILL 인데 calc-layout 은 collector_runs 를 안 남겨 흔적조차 없다.
    #    근본 처방(별건): 이름 정규화를 쌍마다가 아니라 로드 직후 1회만 캐싱 / 버킷으로 후보 축소.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Estimate layout types
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/calc-layout.mjs $ARGS
