name: Naver Listings Collection

on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = KST 04:00
  workflow_dispatch:
    inputs:
      limit:
        description: '아파트 제한 수 (0=전체)'
        required: false
        default: '0'
      dry_run:
        description: 'Dry run (데이터 수집만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL 또는 SUPABASE_SERVICE_KEY secret이 설정되지 않았습니다"
            echo "::error::GitHub repo Settings > Secrets에서 설정해주세요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect Naver listings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          node scripts/collectors/naver-listings.mjs $ARGS
        continue-on-error: true

      - name: Sync naver complex data to apartments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/sync-naver-complex.mjs

      - name: Calculate exclusive ratio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/calc-exclusive-ratio.mjs
