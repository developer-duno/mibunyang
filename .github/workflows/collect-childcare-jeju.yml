name: Childcare Jeju Collection

on:
  schedule:
    - cron: '0 21 1 * *' # 매월 1일 UTC 21:00 = KST 06:00 (collect-childcare.yml KST 05:00 와 1시간 차)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-childcare-jeju:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHILDCARE_JEJU_KEY: ${{ secrets.CHILDCARE_JEJU_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$CHILDCARE_JEJU_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, CHILDCARE_JEJU_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect childcare info (Jeju, cpmsapi017)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHILDCARE_JEJU_KEY: ${{ secrets.CHILDCARE_JEJU_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/childcare-info-jeju.mjs $ARGS
