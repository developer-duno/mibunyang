name: Collect Maintenance Cost
on:
  schedule:
    # 매월 15~19일 15:00 KST. 5일 연속 = 미채움을 --limit=600 × 5회차로 며칠 내 완납하려는 의도된 설계이며,
    # 15~19일은 다른 MOLIT 수집기가 없는 빈 날이라 data.go.kr 일일 쿼터 충돌이 0 이다.
    #
    # ⚠️ UTC 03:00 → 06:00 (세션 500). 옛 시각은 **쿼터만 보고 concurrency 를 안 봤다.**
    #    15~19일 중 월요일이 오면(2026-08-17) 주간 청약홈 체인 2개가 이 잡의 실행창(120분) 안에 도착한다
    #    — applyhome-detail(UTC 03:30) · applyhome-remndr(UTC 04:30). data-collection 그룹은 실행 1개 + 대기
    #    1개까지만 유지하므로 2번째 도착이 첫 대기자를 취소시킨다. 그렇게 취소된 회차는 steps 가 비어
    #    collector_runs 행조차 남지 않아 monitor-collectors 가 못 잡는다(= 조용한 손실).
    #    UTC 06:00~14:00 은 이 그룹에서 비어 있다. 회귀 가드 = scripts/audit-cron-concurrency.mjs (CI)
    - cron: '0 6 15-19 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$MOLIT_KEY" ]; then echo "::error::MOLIT_KEY not set"; exit 1; fi
          if [ -z "$SUPABASE_URL" ]; then echo "::error::SUPABASE_URL not set"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::SUPABASE_SERVICE_KEY not set"; exit 1; fi
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Collect maintenance cost
        run: |
          # --limit=600: 단지당 ~6회 API 호출 → ~3600회/회차 (data.go.kr 일일 1만 한도 분산)
          ARGS="--limit=600"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/collectors/collect-maintenance.mjs $ARGS
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
