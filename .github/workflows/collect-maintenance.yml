name: Collect Maintenance Cost
on:
  schedule:
    - cron: '0 3 15 * *'   # 매월 15일 12:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$MOLIT_KEY" ]; then echo "::error::MOLIT_KEY not set"; exit 1; fi
          if [ -z "$SUPABASE_URL" ]; then echo "::error::SUPABASE_URL not set"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::SUPABASE_SERVICE_KEY not set"; exit 1; fi
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Collect maintenance cost
        run: |
          # --limit=1000: 단지당 ~6회 API 호출 → ~6000회/회차 (data.go.kr 일일 1만 한도 분산)
          ARGS="--limit=1000"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/collectors/collect-maintenance.mjs $ARGS
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
