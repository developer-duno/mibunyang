name: Collect Maintenance Cost
on:
  schedule:
    - cron: '0 3 15-19 * *'   # 매월 15~19일 12:00 KST (5일 연속 — 미채움 ~1415건을 --limit=600×5회차로 며칠 내 완납, 15~19일은 다른 MOLIT 수집기 없는 빈 날이라 쿼터 충돌 0)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$MOLIT_KEY" ]; then echo "::error::MOLIT_KEY not set"; exit 1; fi
          if [ -z "$SUPABASE_URL" ]; then echo "::error::SUPABASE_URL not set"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::SUPABASE_SERVICE_KEY not set"; exit 1; fi
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Collect maintenance cost
        run: |
          # --limit=600: 단지당 ~6회 API 호출 → ~3600회/회차 (data.go.kr 일일 1만 한도 분산)
          ARGS="--limit=600"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/collectors/collect-maintenance.mjs $ARGS
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
