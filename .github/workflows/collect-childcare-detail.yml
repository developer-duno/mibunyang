name: Childcare Detail Collection

on:
  schedule:
    - cron: '0 19 * * *' # 매일 UTC 19:00 = KST 04:00 (DAILY_LIMIT 분산, ~23일 누적)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false
      daily_limit:
        description: 'cpmsapi030 일일 호출 한도'
        required: false
        default: '1000'

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-childcare-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHILDCARE_BASIC_API_KEY: ${{ secrets.CHILDCARE_BASIC_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$CHILDCARE_BASIC_API_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, CHILDCARE_BASIC_API_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect childcare detail (cpmsapi030 70 필드, DAILY_LIMIT 분산)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHILDCARE_BASIC_API_KEY: ${{ secrets.CHILDCARE_BASIC_API_KEY }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '1000' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/childcare-detail.mjs $ARGS
