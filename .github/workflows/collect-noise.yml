name: 소음 추정 수집

on:
  schedule:
    - cron: "0 4 1 * *" # 매월 1일 13:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (DB 미반영)"
        required: false
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Estimate noise levels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/noise-estimate.mjs $ARGS
