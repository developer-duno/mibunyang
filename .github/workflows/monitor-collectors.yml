name: Monitor Collectors

# 수집기 감시 — 실패/취소/0건/미발화/NULL급증을 텔레그램으로 알림.
# workflow_run: 수집기가 끝나면 즉시 점검. schedule: 하루 1회 전체 스윕.
# workflow_run.workflows 는 와일드카드 미지원 → collect-*.yml name 필드 + calc/fill 비-수집기 명시 나열.
# 새 수집기 추가 시 collect-*.yml 목록 누락은 scripts/audit-monitor-coverage.mjs (CI) 가 차단
# (calc-*.yml·backfill-new-apartments.yml 은 audit 범위 밖 — 아래 목록에 수동 유지).

on:
  workflow_run:
    workflows:
      - "Childcare Facilities Collection"
      - "Collect Applyhome Competition Rate"
      - "Collect Applyhome Detail (Schedule + Units)"
      - "Collect Applyhome Remndr (잔여세대 평형 + 취소후재공급)"
      # 국토부(apis.data.go.kr/1613000) 5종 = 해외 IP 복불복 차단(2026-08-06~)으로
      # 집서버 로컬 러너 이전 (scripts/kosis-local-runner.mjs, 세션 515) — yml 삭제로 목록 제거:
      # Building Info Collection (MOLIT) / Collect Building Hub / Collect MOLIT Units /
      # Collect Maintenance Cost / Collect Trades. 감시는 아래 KOSIS 와 동일하게
      # monitor-collectors.mjs EXTERNAL_API_COLLECTORS (collector_runs 신선도) 가 승계.
      - "DART 시공사 재무 수집"
      # 세션525: "Emergency Medical Facilities Collection" 제거 — apis.data.go.kr/B552657
      #   (국립중앙의료원 응급의료기관)도 해외 IP 차단(GH 8/02·8/04 연속 `fetch failed` / 로컬
      #   한국 IP 는 resultCode=00 NORMAL SERVICE)이라 yml 삭제 + 로컬 러너 매월 3일 이전.
      #   이름만 남기면 매일 "실행 기록이 한 번도 없음" 거짓 경보가 난다(세션 519 선례).
      #   감시는 EXTERNAL_API_COLLECTORS 의 `emergency`(collector_runs 신선도) 가 승계.
      - "Environment Data Collection"
      # 세션 519 정리 — 아래 3종은 워크플로가 없는데 이름만 남아 매일 거짓 경보를 냈다:
      #   "Housing Permits Data Collection" = 세션 501 에 yml 삭제(KOSIS 이전)됐는데 목록에 잔존.
      #     monitor-collectors.mjs 주석엔 "제거했다"고 적혀 있었지만 이 yml 은 안 고쳐졌다 —
      #     **한쪽만 고치면 조용히 어긋난다**(매일 "실행 기록이 한 번도 없음" 발화).
      #   "Air Quality Collection" / "Housing Price Data Collection" = 세션 519 에 로컬 러너 이전.
      #     www.data.go.kr·apis.data.go.kr 도 해외 IP 차단(로컬 한국 IP 는 200 OK 실측).
      # 감시는 셋 다 monitor-collectors.mjs EXTERNAL_API_COLLECTORS (collector_runs 신선도) 가 승계.
      - "Industry Complex Matching"
      - "Infra Facilities Collection"
      # KOSIS 10종 (KOSIS 8 + Average Income + Migration) = kosis.kr 해외 IP 차단으로
      # 집서버 로컬 러너 이전 (scripts/kosis-local-runner.mjs, 세션 288~289) — yml 삭제로 목록 제거.
      # 감시는 monitor-collectors.mjs EXTERNAL_API_COLLECTORS (collector_runs 신선도) 가 승계.
      - "Naver Post-Processing (Core)"
      - "Naver Post-Processing (Incremental)"
      - "Nearby Childcare Collection"
      - "Noxious Facility Collection"
      - "Police Station Collection"
      - "Population Data Collection"
      - "School District Collection"
      - "Trade Stats Calculation"
      - "Trade Stats Regions Collection"
      - "Transport Accessibility Collection"
      - "소음 추정 수집"
      # ── 계산·일괄채우기 워크플로 (collect-* 아님 — audit 범위 밖, 수동 유지) ──
      - "Backfill New Apartments"
      - "Exclusive Ratio Calculation"
      - "Layout Estimation"
      # ── 분양 알림 발송기 (세션 467 — collect-* 아님, audit 범위 밖 수동 유지) ──
      - "Notify Subscribers (분양 알림 발송)"
      # ── 일일 데이터 갱신 (compute-scores + refresh-data, 세션 311 v4 추가) ──
      - "Daily Data Refresh"
    types: [completed]
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 00:00 = KST 09:00 — daily 전체 스윕
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (daily=전체 스윕 / test=텔레그램 전송 테스트)'
        required: false
        type: choice
        default: daily
        options:
          - daily
          - test

# GITHUB_TOKEN 권한 명시 — 미선언 시 actions 스코프 누락 가능.
# monitor 가 /actions/runs·/actions/workflows 로 수집기 마지막 run 시각을 조회 →
# actions:read 없으면 403 → 미발화 오탐 (세션 271 사고).
permissions:
  actions: read
  contents: read

jobs:
  monitor:
    # 세션 491: workflow_run 팬아웃 억제 — 트리거 수집기가 success 면 감시 잡을 띄우지 않는다.
    # 실측(8/1~8/4): Monitor 39회 중 35회가 workflow_run 이고 감시 대상 40 run 중 비정상은 4건뿐 →
    # 36회가 "이상 없음"만 찍고 1분씩 과금. 실패·취소 알림은 그대로 즉시 발화하고,
    # 잃는 것은 "success 인데 ok_count=0"(빈 성공) 알림의 즉시성뿐 — 이는 L51-52 의 매일 UTC 00:00
    # daily 전체 스윕(①②③④⑤)이 최대 24h 안에 동일하게 잡는다. 빈 성공은 며칠~몇 주 단위로 굳는
    # 유형(housing-permits 3개월 연속 ok=0)이라 하루 지연의 실질 손해가 없다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            node scripts/monitor-collectors.mjs --mode=run
          else
            node scripts/monitor-collectors.mjs --mode=${{ inputs.mode || 'daily' }}
          fi
