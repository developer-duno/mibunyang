name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'docs/**'
      - '.claude/**'
      - '*.md'
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: ETL env-key 3-way audit
        run: node scripts/audit-env-keys.mjs

      - name: 수집기 감시 커버리지 audit
        run: node scripts/audit-monitor-coverage.mjs

      - name: 수집기 매칭 패턴 audit
        run: node scripts/audit-collector-patterns.mjs

      - name: fill matrix 외부 cron 교집합 audit
        run: node scripts/audit-fill-matrix.mjs

      - name: Test
        env:
          VITE_FEATURE_UPCOMING: "true"
        run: npm run test

      - name: Build
        run: npm run build
