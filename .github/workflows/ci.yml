name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'docs/**'
      - '.claude/**'
      - '*.md'
  pull_request:
    branches: [main]

# 세션 491: 연속 푸시 시 낡은 실행 자동 취소 (PR 한정).
# 같은 PR 에 커밋을 연달아 밀면 이전 커밋을 보던 실행이 끝까지 돌며 분을 태운다.
# main push 는 취소하지 않는다 — 머지 커밋 검사는 하나도 건너뛰면 안 되기 때문.
# ⚠️ pull_request 에 paths-ignore 를 넣지 않은 것은 의도다. 경로 필터로 건너뛴 체크를
# 브랜치 보호의 required status check 로 걸면 PR 이 "Waiting for status" 로 영구히 막힌다.
# (push 쪽 paths-ignore 는 필수 체크 대상이 아니라 무해.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: ETL env-key 3-way audit
        run: node scripts/audit-env-keys.mjs

      - name: 수집기 감시 커버리지 audit
        run: node scripts/audit-monitor-coverage.mjs

      - name: 수집기 매칭 패턴 audit
        run: node scripts/audit-collector-patterns.mjs

      - name: fill matrix 외부 cron 교집합 audit
        run: node scripts/audit-fill-matrix.mjs

      - name: Claude 훅 배선 audit
        run: node scripts/audit-hooks-wiring.mjs

      # 세션 491: e2e.yml 과 warm-playwright-cache.yml 의 캐시 키가 어긋나면
      # 캐시가 영원히 미스되는데 CI 는 초록이라 아무도 모른다 → 기계가 검사한다.
      - name: Playwright 캐시 키 audit
        run: node scripts/audit-playwright-cache.mjs

      - name: Test
        env:
          VITE_FEATURE_UPCOMING: "true"
        run: npm run test

      - name: Build
        run: npm run build
