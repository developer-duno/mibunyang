name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'docs/**'
      - '.claude/**'
      - '*.md'
  pull_request:
    branches: [main]

# 세션 491: 연속 푸시 시 낡은 실행 자동 취소 (PR 한정).
# 같은 PR 에 커밋을 연달아 밀면 이전 커밋을 보던 실행이 끝까지 돌며 분을 태운다.
# main push 는 취소하지 않는다 — 머지 커밋 검사는 하나도 건너뛰면 안 되기 때문.
#
# 🔴 `push: branches: [main]` 을 **빼지 말 것** (세션 491 실측 확정).
#    빼려면 브랜치 보호의 required status check 가 있어야 하는데, 그걸 켜면
#    daily-deploy.yml:59 의 `git push origin main`(매일 데이터 갱신 커밋)이
#    `GH006: Protected branch update failed / Required status check "ci" is expected` 로
#    **거부되어 매일 배포가 죽는다.** 실제로 켰다가 즉시 되돌렸다.
#    → 이 push 트리거가 현재 유일한 "머지 커밋 검사" 경로다.
#    자세한 근거·대안 3안은 .github/workflows/CLAUDE.md "필수 상태 검사는 켤 수 없다" 절.
#
# ⚠️ pull_request 에 paths-ignore 를 넣지 않은 것도 의도다(필수 체크 도입 시의 함정 대비 +
#    지금은 이쪽이 유일한 전량 검사라서). push 쪽 paths-ignore 는 무해.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: ETL env-key 3-way audit
        run: node scripts/audit-env-keys.mjs

      - name: 수집기 감시 커버리지 audit
        run: node scripts/audit-monitor-coverage.mjs

      - name: 수집기 매칭 패턴 audit
        run: node scripts/audit-collector-patterns.mjs

      - name: fill matrix 외부 cron 교집합 audit
        run: node scripts/audit-fill-matrix.mjs

      # 세션 511: transit-match.mjs 를 실행하는 워크플로가 5개월간 0건이었다 —
      # audit-monitor-coverage 는 "워크플로가 돌리는 수집기"만 보므로 워크플로 자체가
      # 없는 수집기는 검사 대상 밖이었다. 이 감사는 그 사각지대(실행 경로 0개)를 잡는다.
      - name: 고아 수집기(실행 경로 0개) audit
        run: node scripts/audit-orphan-collectors.mjs

      - name: Claude 훅 배선 audit
        run: node scripts/audit-hooks-wiring.mjs

      # 세션 491: e2e.yml 과 warm-playwright-cache.yml 의 캐시 키가 어긋나면
      # 캐시가 영원히 미스되는데 CI 는 초록이라 아무도 모른다 → 기계가 검사한다.
      - name: Playwright 캐시 키 audit
        run: node scripts/audit-playwright-cache.mjs

      # 세션 500: concurrency 그룹은 실행 1개 + 대기 1개까지만 유지한다. 실행창 안에 2개 이상
      # 도착하면 먼저 대기한 회차가 조용히 취소되는데, steps 가 비어 collector_runs 행조차 없어
      # monitor-collectors 가 못 잡는다 → 달력 대조를 사람이 아니라 기계가 한다.
      - name: concurrency 조용한 취소 audit
        run: node scripts/audit-cron-concurrency.mjs

      # 세션 508: Vite 는 허용하지만 Node ESM 은 거부하는 문법(속성 없는 JSON import 등)이
      # compute-scores 의 import 사슬에 스며들면 CI 전부 초록인 채 운영 점수 갱신만 죽는다
      # (PR-1 #364 실사고 — daily-deploy 크론 3시간 전 발견) → 같은 방식으로 열어서 검사한다.
      - name: Node ESM 사슬 import audit
        run: node --loader ./scripts/alias-loader.mjs scripts/audit-node-esm-chain.mjs

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
