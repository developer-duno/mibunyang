name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: Test
        env:
          VITE_FEATURE_UPCOMING: "true"
        run: npm run test

      - name: Build
        run: npm run build
