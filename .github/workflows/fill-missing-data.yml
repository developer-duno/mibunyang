name: Fill Missing Data

on:
  schedule:
    - cron: '0 21 * * 0' # 매주 일요일 UTC 21:00 = KST 월 06:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

# ── Phase 1: 좌표 확보 (순차 — reverse-geocode는 geocode 이후) ──
jobs:
  phase1-coords:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY 필요"
            exit 1
          fi

      - name: "1/16 좌표 확보 (geocode-missing)"
        id: geocode
        continue-on-error: true
        run: node scripts/collectors/geocode-missing.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "2/16 주소 확보 (reverse-geocode)"
        id: reverse
        continue-on-error: true
        run: node scripts/collectors/reverse-geocode.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "Phase 1 결과 확인"
        if: always()
        run: |
          FAILS=0
          [ "${{ steps.geocode.outcome }}" = "failure" ] && FAILS=$((FAILS+1)) && echo "❌ geocode-missing 실패"
          [ "${{ steps.reverse.outcome }}" = "failure" ] && FAILS=$((FAILS+1)) && echo "❌ reverse-geocode 실패"
          echo "Phase 1: ${FAILS}건 실패"
          if [ $FAILS -gt 0 ]; then
            echo "::warning::Phase 1에서 ${FAILS}건 실패"
          fi

  # ── Phase 2: 순수 계산 (병렬, 외부 API 없음) ──────────────
  phase2-calc:
    needs: phase1-coords
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script:
          - { name: "네이버 동기화", cmd: "sync-naver-complex" }
          - { name: "전용률 계산", cmd: "calc-exclusive-ratio" }
          - { name: "평면구조 추정", cmd: "calc-layout" }
          - { name: "층수 계산", cmd: "calc-floors" }
          - { name: "산업단지 매칭", cmd: "industry-match" }
          - { name: "규제지역 적용", cmd: "regulation-seed" }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "${{ matrix.script.name }}"
        run: node scripts/collectors/${{ matrix.script.cmd }}.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

  # ── Phase 3: Kakao/외부 API (병렬, 좌표 필요) ─────────────
  phase3-external:
    needs: phase1-coords
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        script:
          - { name: "교통 수집", cmd: "transport-tago", extra_env: "TAGO_KEY" }
          - { name: "인프라 수집", cmd: "infra-kakao", extra_env: "KAKAO_KEY" }
          - { name: "학교 수집", cmd: "schools-neis", extra_env: "" }
          - { name: "환경 수집", cmd: "environment", extra_env: "KAKAO_KEY" }
          - { name: "소음 추정", cmd: "noise-estimate", extra_env: "" }
          - { name: "혐오시설 수집", cmd: "noxious", extra_env: "KAKAO_KEY" }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_KEY }}
      TAGO_KEY: ${{ secrets.TAGO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "${{ matrix.script.name }}"
        run: node scripts/collectors/${{ matrix.script.cmd }}.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

  # ── Phase 4: 독립 외부 API (좌표 불필요, 병렬) ────────────
  phase4-independent:
    needs: phase1-coords
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        script:
          - { name: "시공사 재무", cmd: "dart-builders" }
          - { name: "건축물 상세", cmd: "molit-building-info" }
          - { name: "인구 증감률", cmd: "population" }
          - { name: "전입출 순이동", cmd: "migration" }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
      MOIS_POP_KEY: ${{ secrets.MOIS_POP_KEY }}
      DART_KEY: ${{ secrets.DART_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "${{ matrix.script.name }}"
        run: node scripts/collectors/${{ matrix.script.cmd }}.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

  # ── Phase 5: 실거래 (별도 job — 단독으로도 5시간+ 소요) ──
  fill-trades:
    needs: [phase1-coords, phase2-calc, phase3-external, phase4-independent]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MOLIT_KEY: ${{ secrets.MOLIT_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: "실거래 수집 (collect-trades)"
        id: trades
        continue-on-error: true
        run: node scripts/collectors/collect-trades.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "거래통계 산출 (trade-stats)"
        id: stats
        continue-on-error: true
        run: node scripts/collectors/trade-stats.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "Phase 5 결과 확인"
        if: always()
        run: |
          FAILS=0
          [ "${{ steps.trades.outcome }}" = "failure" ] && FAILS=$((FAILS+1)) && echo "❌ collect-trades 실패"
          [ "${{ steps.stats.outcome }}" = "failure" ] && FAILS=$((FAILS+1)) && echo "❌ trade-stats 실패"
          echo "Phase 5: ${FAILS}건 실패"
          [ $FAILS -gt 0 ] && exit 1
