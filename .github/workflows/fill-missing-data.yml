name: Fill Missing Data

on:
  schedule:
    - cron: '0 21 * * 0' # 매주 일요일 UTC 21:00 = KST 월 06:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  fill-all:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_KEY }}
      TAGO_KEY: ${{ secrets.TAGO_KEY }}
      MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
      MOIS_POP_KEY: ${{ secrets.MOIS_POP_KEY }}
      DART_KEY: ${{ secrets.DART_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY 필요"
            exit 1
          fi
          echo "✅ Supabase secrets OK"
          [ -n "$KAKAO_KEY" ] && echo "✅ KAKAO_KEY OK" || echo "⚠️ KAKAO_KEY 없음"
          [ -n "$TAGO_KEY" ] && echo "✅ TAGO_KEY OK" || echo "⚠️ TAGO_KEY 없음"
          [ -n "$MOLIT_KEY" ] && echo "✅ MOLIT_KEY OK" || echo "⚠️ MOLIT_KEY 없음"
          [ -n "$MOIS_POP_KEY" ] && echo "✅ MOIS_POP_KEY OK" || echo "⚠️ MOIS_POP_KEY 없음"
          [ -n "$DART_KEY" ] && echo "✅ DART_KEY OK" || echo "⚠️ DART_KEY 없음"

      # ── Phase 1: 좌표 확보 ──────────────────────────────
      - name: "1/16 좌표 확보 (geocode-missing)"
        continue-on-error: true
        run: node scripts/collectors/geocode-missing.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "2/16 주소 확보 (reverse-geocode)"
        continue-on-error: true
        run: node scripts/collectors/reverse-geocode.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # ── Phase 2: 순수 계산 (외부 API 없음) ──────────────
      - name: "3/16 전용률 계산 (calc-exclusive-ratio)"
        continue-on-error: true
        run: node scripts/collectors/calc-exclusive-ratio.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "4/16 평면구조 추정 (calc-layout)"
        continue-on-error: true
        run: node scripts/collectors/calc-layout.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "5/18 산업단지 매칭 (industry-match)"
        continue-on-error: true
        run: node scripts/collectors/industry-match.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "5a/18 층수 범위 계산 (calc-floors)"
        continue-on-error: true
        run: node scripts/collectors/calc-floors.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "5b/18 규제지역 적용 (regulation-seed)"
        continue-on-error: true
        run: node scripts/collectors/regulation-seed.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # ── Phase 3: Kakao API ──────────────────────────────
      - name: "6/16 교통 수집 (transport-tago)"
        continue-on-error: true
        run: node scripts/collectors/transport-tago.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "7/16 인프라 수집 (infra-kakao)"
        continue-on-error: true
        run: node scripts/collectors/infra-kakao.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "8/16 학교 수집 (schools-neis)"
        continue-on-error: true
        run: node scripts/collectors/schools-neis.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "9/16 환경 수집 (environment)"
        continue-on-error: true
        run: node scripts/collectors/environment.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "10/16 소음 추정 (noise-estimate)"
        continue-on-error: true
        run: node scripts/collectors/noise-estimate.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "11/16 혐오시설 수집 (noxious)"
        continue-on-error: true
        run: node scripts/collectors/noxious.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # ── Phase 4: 외부 API (MOLIT, DART, MOIS) ──────────
      - name: "12/16 시공사 재무 (dart-builders)"
        continue-on-error: true
        run: node scripts/collectors/dart-builders.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "13/16 건축물 상세 (molit-building-info)"
        continue-on-error: true
        run: node scripts/collectors/molit-building-info.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "14/16 인구 증감률 (population)"
        continue-on-error: true
        run: node scripts/collectors/population.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "15/16 전입출 순이동 (migration)"
        continue-on-error: true
        run: node scripts/collectors/migration.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

  # ── Phase 5: 실거래 (별도 job — 단독으로도 5시간+ 소요) ──
  fill-trades:
    needs: fill-all
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MOLIT_KEY: ${{ secrets.MOLIT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: "16a 실거래 수집 (collect-trades)"
        continue-on-error: true
        run: node scripts/collectors/collect-trades.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "16b 거래통계 산출 (trade-stats)"
        continue-on-error: true
        run: node scripts/collectors/trade-stats.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}
