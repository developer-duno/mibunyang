name: Fill Missing Data

on:
  schedule:
    - cron: '0 2 * * 0' # 매주 일요일 UTC 02:00 = KST 일 11:00 (data-collection 빈 슬롯 — calc 22~23시·trade-stats 16시와 분리)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

# ── Phase 1: 좌표 확보 (순차 — reverse-geocode는 geocode 이후) ──
jobs:
  phase1-coords:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY 필요"
            exit 1
          fi

      - name: "1/16 좌표 확보 (geocode-missing)"
        id: geocode
        continue-on-error: true
        run: node scripts/collectors/geocode-missing.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "2/16 주소 확보 (reverse-geocode)"
        id: reverse
        continue-on-error: true
        run: node scripts/collectors/reverse-geocode.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: "Phase 1 결과 확인"
        if: always()
        run: |
          FAILS=0
          [ "${{ steps.geocode.outcome }}" = "failure" ] && FAILS=$((FAILS+1)) && echo "❌ geocode-missing 실패"
          [ "${{ steps.reverse.outcome }}" = "failure" ] && FAILS=$((FAILS+1)) && echo "❌ reverse-geocode 실패"
          echo "Phase 1: ${FAILS}건 실패"
          if [ $FAILS -gt 0 ]; then
            echo "::warning::Phase 1에서 ${FAILS}건 실패"
          fi

  # ── Phase 2: 순수 계산 (병렬, 외부 API 없음) ──────────────
  # 외부 cron 박힌 collector 는 fill 매트릭스 제외 — sub-step 동시 실행 충돌 회피
  # (세션 291 박제: calc-exclusive-ratio + calc-layout + industry-match 가 외부 cron 발화 시 같은 collector 동시 실행 → cancelled 8 주 연속 사고)
  phase2-calc:
    needs: phase1-coords
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script:
          - { name: "네이버 동기화", cmd: "sync-naver-complex" }
          - { name: "층수 계산", cmd: "calc-floors" }
          - { name: "규제지역 적용", cmd: "regulation-seed" }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: "${{ matrix.script.name }}"
        run: node scripts/collectors/${{ matrix.script.cmd }}.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}
