name: Migration Data Collection

on:
  schedule:
    - cron: '0 22 6 * *' # 매월 6일 UTC 22:00 = KST 7일 07:00 (세션391: population 5일 직후로 당겨 VIEW netMigration 공백 ~10일→~1일 축소. KOSIS_MIGRATION_KEY = MOLIT_KEY와 별 키라 6일 trades 쿼터 충돌 0. 같은 data-collection 그룹 trades 20:00/molit-units 18:00 뒤 큐 순차)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KOSIS_MIGRATION_KEY: ${{ secrets.KOSIS_MIGRATION_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$KOSIS_MIGRATION_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, KOSIS_MIGRATION_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect migration data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KOSIS_MIGRATION_KEY: ${{ secrets.KOSIS_MIGRATION_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/migration.mjs $ARGS
