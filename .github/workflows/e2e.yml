name: E2E Tests
on:
  pull_request:
    branches: [main]
    # 세션 491: E2E 는 `npm run dev` 로 띄운 화면(src·public·index.html)만 훑는다.
    # 아래 경로만 바뀐 PR 은 실브라우저로 검증할 대상이 없다.
    # ⚠️ '.github/workflows/**' 는 절대 넣지 말 것 — 이 파일 자신을 고칠 때 검증이 사라진다.
    # ⚠️ scripts/ 는 여기선 제외해도 안전하다(수집기는 CI 의 vitest 가 계속 검사).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'scripts/**'
      - 'supabase/**'

# 세션 491: 연속 푸시 시 낡은 실행 자동 취소 (E2E 는 pull_request 전용이라 전부 취소 대상).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 세션 491: 브라우저 바이너리 캐시. 키에 @playwright/test 버전을 박아 버전업 시 자동 무효화.
      # ⚠️ 이 캐시는 warm-playwright-cache.yml 이 main 에서 예열해야 효과가 난다 —
      #    Actions 캐시는 "만든 브랜치 + 기본 브랜치"에서만 읽히는데 이 워크플로는 pull_request
      #    전용이라 PR 이 만든 캐시를 다른 PR 이 못 읽는다(실측: PR 런은 cache not found).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.62.1

      # ⚠️ `--with-deps` 유지 필수 — 설치 70초 중 53초가 apt(시스템 라이브러리)이고 캐시 대상이 아니다.
      #    빼면 webkit 이 실행되지 않는다.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # SUPABASE_ANON_KEY는 공개 키 — GitHub Secrets에 등록 필요
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          VITE_USE_SUPABASE: "true"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_FEATURE_UPCOMING: "true"
          VITE_FEATURE_HOME: "true"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
