name: E2E Tests
on:
  pull_request:
    branches: [main]
    # 세션 491: E2E 는 `npm run dev` 로 띄운 화면(src·public·index.html)만 훑는다.
    # 아래 경로만 바뀐 PR 은 실브라우저로 검증할 대상이 없다.
    # ⚠️ '.github/workflows/**' 는 절대 넣지 말 것 — 이 파일 자신을 고칠 때 검증이 사라진다.
    # ⚠️ scripts/ 는 여기선 제외해도 안전하다(수집기는 CI 의 vitest 가 계속 검사).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'scripts/**'
      - 'supabase/**'

# 세션 491: 연속 푸시 시 낡은 실행 자동 취소 (E2E 는 pull_request 전용이라 전부 취소 대상).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 세션663: 15 → 20 — 설치 재시도(최대 5분×2)가 들어가도 시험(평소 2분 40초)이 돌 자리를 남긴다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 세션 491: 브라우저 바이너리 캐시. 키에 @playwright/test 버전을 박아 버전업 시 자동 무효화.
      # ⚠️ 이 캐시는 warm-playwright-cache.yml 이 main 에서 예열해야 효과가 난다 —
      #    Actions 캐시는 "만든 브랜치 + 기본 브랜치"에서만 읽히는데 이 워크플로는 pull_request
      #    전용이라 PR 이 만든 캐시를 다른 PR 이 못 읽는다(실측: PR 런은 cache not found).
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.64.1

      # ⚠️ `--with-deps` 유지 필수 — 설치 70초 중 53초가 apt(시스템 라이브러리)이고 캐시 대상이 아니다.
      #    빼면 webkit 이 실행되지 않는다.
      # 세션663: 러너의 apt 서버가 느린 날(10/26 두 번 — 119MB 를 138kB/s 로 14분 24초)엔 이 단계가
      #   잡 제한 15분을 다 먹고 끊겼다(재실행하면 1분). 한 번에 5분까지만 기다리고 한 번 더 시도한다.
      #   sudo 아래 apt 는 timeout 신호가 안 닿을 수 있어 이름을 정확히 짚어 치운다(-f apt-get 은 pkill 자신도 맞음)
      #   · dpkg 정리도 60초 한도. 단계 14분 = (5분 + 끊기 유예 15초) × 2 + 정리 · 잡 20분 안.
      - name: Install Playwright browsers
        timeout-minutes: 14
        run: |
          for i in 1 2; do
            timeout -k 15 300 npx playwright install --with-deps chromium webkit && exit 0
            [ "$i" = 2 ] && break
            echo "::warning::Playwright 설치 1번째 시도가 5분 안에 안 끝났거나 실패(apt 서버 지연 의심) — 남은 apt 를 치우고 다시"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo pkill -9 -f '^/usr/lib/apt/methods/' || true
            sleep 2
            sudo timeout 60 dpkg --configure -a || true
          done
          echo "::error::Playwright 설치 2회 모두 실패 — Actions 에서 이 잡만 다시 실행"
          exit 1

      # 세션598: VITE_SUPABASE_URL·ANON_KEY 주입을 뺐다 — src/·e2e/ 에 읽는 코드 0곳
      # (USE_SUPABASE=true 면 /api/supabase/apartments 를 vite 프록시로 부를 뿐). 로봇 PR 은 비밀값을 못 받아도 같다.
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          VITE_USE_SUPABASE: "true"
          VITE_FEATURE_UPCOMING: "true"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
