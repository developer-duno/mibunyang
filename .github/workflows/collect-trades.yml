name: Collect Trades (국토부 실거래)

on:
  schedule:
    - cron: '0 20 6 * *' # 매월 6일 UTC 20:00 = KST 05:00 (실거래 데이터 매월 5일 갱신)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false
      months:
        description: '수집 개월 수 (기본 6)'
        required: false
        type: number
        default: 6

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-trades:
    runs-on: ubuntu-latest
    # 세션306: 5/6 60분 cancelled → 120분. 세션490: 7/6 도 120분 정확히 도달해 cancelled.
    # 4-way 실측 결과 진앙은 데이터 증가가 아니라 **국토부 API 지연** — 6/6 성공 run 은 API 3402건을
    # 73.8분(분당 46건)에 완주했는데 7/6 은 같은 3150건 지점에 120분(분당 26건, 1.8배 지연)이 걸렸고
    # 그 시점 수집량은 오히려 적었다(464,958 vs 490,078). 73.8 × 1.8 ≈ 133분 → 180 + 예산 150분.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$MOLIT_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY, MOLIT_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect trades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ inputs.months }}" ] && [ "${{ inputs.months }}" != "6" ]; then
            ARGS="$ARGS --months=${{ inputs.months }}"
          fi
          node scripts/collectors/collect-trades.mjs $ARGS
