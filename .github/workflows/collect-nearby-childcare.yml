name: Nearby Childcare Collection

on:
  schedule:
    - cron: '30 20 * * *' # 매일 UTC 20:30 = KST 05:30 (childcare-detail cron 04:00 뒤 — 70 필드 갱신분 반영)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-nearby-childcare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect nearby childcare (단지별 1km 5건 → schools.nearby_childcare)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/collect-nearby-childcare.mjs $ARGS
