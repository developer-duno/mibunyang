name: Nearby Childcare Collection

on:
  schedule:
    # 세션 491: 매일 → 주 1회(화). 입력 regions.childcare 의 최신 recorded_at 이 2026-05-15(82일 전)로
    # 멈춰 있고, 수집 로직을 그대로 재계산해 DB 저장값과 677건 × 8필드 전부 대조한 결과 다른 값이 0건이었다
    # (매일 같은 값을 다시 쓰는 헛돌이). 원천은 collect-childcare.yml(매월 1일)이라 주 1회로도 지연 ≤ 3~4일.
    - cron: '30 20 * * 2' # 매주 화 UTC 20:30 = KST 수 05:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (미리보기만, DB 미저장)'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect-nearby-childcare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_KEY secret 필요"
            exit 1
          fi
          echo "Secrets validated"

      - name: Collect nearby childcare (단지별 1km 5건 → schools.nearby_childcare)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/collectors/collect-nearby-childcare.mjs $ARGS
