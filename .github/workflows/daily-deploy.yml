name: Daily Data Refresh
on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = KST 03:00
  workflow_dispatch: # 수동 트리거

# 세션 305 P0 spec v3: git push 권한 필요 (Vercel git auto-deploy 가 hook 대체).
permissions:
  contents: write

concurrency:
  group: daily-scoring-deploy
  cancel-in-progress: false

jobs:
  # 세션 491: compute-scores + refresh-data 두 잡을 하나로 합쳤다.
  # refresh-data 가 `needs: compute-scores` 라 애초에 순차 실행이어서 병렬 이득이 0인데도
  # checkout·setup-node·npm ci 를 한 번 더 태우고(런당 14~23초) 잡마다 분 단위 올림 과금을
  # 한 번 더 물었다. 스텝 순서(scores → collect-data → commit/push)는 그대로라 의존이 보존된다.
  # checkout 옵션은 push 가 필요한 refresh-data 쪽(persist-credentials: true)을 채택.
  # timeout 은 두 잡의 합(30+10)으로 잡는다.
  scoring-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps

      # 묶음 열쇠 칸(apartments.complex_key)을 다시 계산한다 — "한 단지 = 한 장" 가) 단계(세션588).
      # 점수 계산보다 앞에 둔다: 다) 단계에서 VIEW 가 이 칸으로 카드를 묶으므로, 점수와 목록이 새 열쇠 위에서 만들어져야 한다.
      # 실패해도(continue-on-error) · 매달려도(timeout-minutes) 굽기는 어제 열쇠로 계속한다. 실패 기록은 감시 ⑬ 이 본다.
      # 일부 행만 실패한 날(실패 10% 미만)은 ⑬ 이 조용하다 — 하루뿐이면 다음 날 실행이 남은 행을 스스로 메우고, 성공이
      # 이틀 가까이(36시간) 없으면 감시 ⑭ 가 알린다. 시간 한도에 걸려 기록 없이 죽은 날도 같다.
      # 한도 5분: 매달려도 뒤 단계 몫과 03:20 파생표 정리 창을 덜 먹게(세션589).
      - name: Assign complex keys (apartments.complex_key)
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/collectors/assign-complex-keys.mjs --apply

      - name: Compute apartment scores (cats_cache)
        # 세션611 결정(작게 고치기): exit 2(재료 없음 = 점수 입력 칸 부재·채움률 미만, F1)만 통과한다 —
        #   아무것도 안 구웠으니 옛 점수(cats_cache) 그대로라 공개 JSON 갱신·배포를 계속해도 섞이지 않는다.
        #   그 밖 실패(로드 실패 · 저장 실패 1건 이상 · 도중 예외 — 모두 exit 1)는 배포를 멈춘다(점수 섞임 방지).
        #   F1·로드 실패·저장 실패는 collector_runs failure 로 남아 감시 ① 이 본다. 도중 예외(main().catch)는
        #   collector_runs 기록 없이 죽는다 — 이 워크플로 실패를 monitor-collectors 의 workflow_run 이 알린다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node --loader ./scripts/alias-loader.mjs scripts/compute-scores.mjs || { rc=$?; if [ "$rc" -eq 2 ]; then echo "F1 멈춤 — 옛 점수 유지, 배포 계속"; else exit "$rc"; fi; }

      - name: collect-data --from-supabase-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/collect-data.mjs --from-supabase-only

      - name: Commit + push (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "변경 없음 — push skip"
            exit 0
          fi
          DATE=$(date -u +%F)
          git commit -m "data: daily refresh $DATE (auto)"
          git push origin main
