name: Daily Data Refresh
on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = KST 03:00
  workflow_dispatch: # 수동 트리거

concurrency:
  group: daily-scoring-deploy
  cancel-in-progress: false

jobs:
  compute-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Compute apartment scores (cats_cache)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node --loader ./scripts/alias-loader.mjs scripts/compute-scores.mjs

  trigger-deploy:
    needs: compute-scores
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          curl -sf -X POST "$HOOK_URL" -o /dev/null && echo "Deploy triggered successfully" || {
            echo "::error::Deploy hook request failed"
            exit 1
          }
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
