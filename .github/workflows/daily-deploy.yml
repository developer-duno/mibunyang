name: Daily Data Refresh
on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = KST 03:00
  workflow_dispatch: # 수동 트리거

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          curl -sf -X POST "$HOOK_URL" -o /dev/null && echo "Deploy triggered successfully" || {
            echo "::error::Deploy hook request failed"
            exit 1
          }
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
